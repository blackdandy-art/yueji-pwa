<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f3ed"><meta name="description" content="月记：记录经期与每日感受，Mac 与 iPhone 可安装的私密本地日记。"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="月记"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"><link rel="icon" href="./icons/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css"><title>月记 · 与自己的节律相处</title></head>
<body><div class="app-shell"><aside class="sidebar"><a class="brand" href="#home" aria-label="月记首页"><span class="brand-symbol">月</span><span>月记</span></a><nav aria-label="主要导航"><button class="nav-item active" data-page="home"><span>◒</span>首页</button><button class="nav-item" data-page="calendar"><span>▦</span>日历</button><button class="nav-item" data-page="history"><span>≋</span>回顾</button><button class="nav-item" data-page="settings"><span>⚙</span>设置</button></nav><div class="sidebar-bottom"><div class="privacy-dot"></div><strong>记录仅存本机</strong><span class="version">月记 · 2.0</span></div></aside><main><header class="topbar"><div class="mobile-brand">月记</div><p id="today-label"></p><span class="local-badge"><i></i>本地私密记录</span></header><div id="demo-banner" class="demo-banner" hidden>演示模式 · 不影响真实记录<button id="leave-demo">退出演示</button></div><section id="page-home" class="page active" aria-labelledby="home-title"></section><section id="page-calendar" class="page" aria-labelledby="calendar-title"></section><section id="page-history" class="page" aria-labelledby="history-title"></section><section id="page-settings" class="page" aria-labelledby="settings-title"></section><footer>预计日期仅供参考。</footer></main></div><nav class="mobile-nav" aria-label="移动导航"><button class="active" data-page="home"><span>◒</span>首页</button><button data-page="calendar"><span>▦</span>日历</button><button data-page="history"><span>≋</span>回顾</button><button data-page="settings"><span>⚙</span>设置</button></nav><dialog id="period-dialog"><form id="period-form"><div class="dialog-top"><button type="button" class="close-button" data-close aria-label="关闭">×</button></div><h2 id="period-dialog-title">记录经期</h2><input type="hidden" name="recordId"><div class="form-row"><label>开始日期<input type="date" name="start" required></label><label>开始时间 · 可不填<input type="time" name="startTime"></label></div><label class="checkbox-label"><input type="checkbox" name="ongoing">这次经期还在进行中</label><div id="end-date-label" class="form-row"><label>结束日期<input type="date" name="end"></label><label>结束时间 · 可不填<input type="time" name="endTime"></label></div><p class="form-error" id="period-error" role="alert"></p><div class="dialog-actions"><button type="button" class="button secondary" data-close>取消</button><button class="button primary" type="submit">保存经期</button></div></form></dialog><dialog id="confirm-dialog"><form method="dialog"><div class="dialog-top"><button class="close-button" value="cancel" aria-label="关闭">×</button></div><h2 id="confirm-title"></h2><p id="confirm-copy" class="muted"></p><div class="dialog-actions"><button class="button secondary" value="cancel">取消</button><button class="button danger" value="ok" id="confirm-ok">确认</button></div></form></dialog><div id="toast" role="status" aria-live="polite"></div><script type="module" src="./app.js"></script></body></html>
